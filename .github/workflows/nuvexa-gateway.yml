name: Nuvexa Gateway Tests
on:
  pull_request:
    paths:
      - "netlify/functions/nuvexa-status.js"
      - "netlify/functions/nuvexa-ingest.js"
      - "tests/nuvexa-status.test.cjs"
      - "tests/nuvexa-ingest.test.cjs"
      - ".github/workflows/nuvexa-gateway.yml"
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/nuvexa-status.test.cjs tests/nuvexa-ingest.test.cjs
